# .mise.toml

[tools]
node = "24"

[tasks]
# Development
dev = { description = "Start the development server", run = "npm run start:dev" }

# Code Quality & Testing
test = { description = "Run unit tests", run = "npm run test" }
"test:watch" = { description = "Run unit tests in watch mode", run = "npm run test:watch" }
"test:cov" = { description = "Run unit tests with coverage", run = "npm run test:cov" }
"test:e2e" = { description = "Run end-to-end tests", run = "npm run test:e2e" }
lint = { description = "Lint source files and fix issues", run = "npm run lint" }
format = { description = "Format source files with Prettier", run = "npm run format" }

# Database Management
db-up = { description = "Start database containers", run = "docker compose up -d" }
db-down = { description = "Stop database containers", run = "docker compose down" }
db-setup = { description = "Start DB, generate client, run migrations, and seed", run = [
  "docker compose up -d",
  "sleep 5",
  "npm run db:generate",
  "npm run db:migrate",
  "npm run db:seed"
] }
