services:
  - type: web
    name: management-app-backend
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: FRONTEND_URL
        sync: false
      # One load balancer in front of the container. Verify per-client rate
      # limiting after deploying (see README: TRUST_PROXY).
      - key: TRUST_PROXY
        value: '1'
      # Set to "none" if the frontend is on a different site than this API.
      - key: COOKIE_SAME_SITE
        value: lax
